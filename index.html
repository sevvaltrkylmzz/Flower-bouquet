<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piksel Buket 💐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="starfield" id="starfield"></div>

<!-- ============ OLUŞTURMA EKRANI ============ -->
<main id="createScreen" class="screen">
  <div class="hero">
    <p class="eyebrow">Piksel Buket</p>
    <h1 class="headline">Ona, <em>açılan</em><br>çiçekler gönder.</h1>
    <p class="lede">Adını yaz, kısa bir not ekle, linki paylaş. Açtığında noktalardan
      örülmüş bir çiçek buketi önünde açar. Ücretsiz, üyelik yok.</p>
  </div>

  <section class="preview-card">
    <div class="preview-head">
      <span class="eyebrow small">Canlı Önizleme</span>
      <span class="for-line" id="previewForLine">senin için</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="previewCanvas"></canvas>
    </div>
  </section>

  <form id="bouquetForm" class="form-card">
    <label>
      <span>Kime?</span>
      <input type="text" id="toName" placeholder="Alıcının adı" required maxlength="40">
    </label>

    <label>
      <span>Kimden <em>(opsiyonel)</em></span>
      <input type="text" id="fromName" placeholder="Senin adın" maxlength="40">
    </label>

    <label>
      <span>Kısa bir not <em>(opsiyonel)</em></span>
      <textarea id="message" placeholder="Ona ne söylemek istersin?" maxlength="200"></textarea>
    </label>

    <div class="theme-row">
      <span class="theme-label">Çiçek paleti</span>
      <div class="swatches">
        <label class="swatch-option">
          <input type="radio" name="theme" value="mixed" checked>
          <span class="swatch mixed"></span>
        </label>
        <label class="swatch-option">
          <input type="radio" name="theme" value="rose">
          <span class="swatch rose"></span>
        </label>
        <label class="swatch-option">
          <input type="radio" name="theme" value="tulip">
          <span class="swatch tulip"></span>
        </label>
        <label class="swatch-option">
          <input type="radio" name="theme" value="sun">
          <span class="swatch sun"></span>
        </label>
      </div>
    </div>

    <button type="submit" class="btn-primary">Buketi oluştur</button>
  </form>

  <div id="linkBox" class="form-card link-box hidden">
    <p class="link-label">Buketin hazır. Bu linki gönder:</p>
    <div class="link-row">
      <input type="text" id="shareLink" readonly>
      <button id="copyBtn" class="btn-secondary">Kopyala</button>
    </div>
    <a id="previewLink" class="btn-text" target="_blank">Önizlemeyi aç →</a>
  </div>
</main>

<!-- ============ SUNUM EKRANI ============ -->
<main id="presentScreen" class="screen hidden">
  <p class="eyebrow">Sana bir buket</p>
  <p class="for-line big" id="toLine"></p>

  <div class="canvas-wrap big reveal" id="revealWrap">
    <canvas id="presentCanvas"></canvas>
  </div>

  <div class="note-card hidden" id="messageCard">
    <p class="msg-line" id="msgLine"></p>
    <p class="from-line" id="fromLine"></p>
  </div>

  <a href="./" class="btn-text back-link">Sen de birine gönder →</a>
</main>

<script src="script.js"></script>
</body>
</html>
